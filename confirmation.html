<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réservation Confirmée - Riad Agadir</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" />
  <style>
    body {
      font-family: 'Roboto Slab', serif;
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }
    .icon {
      font-size: 60px;
      color: #28a745;
      margin-bottom: 20px;
    }
    h1 {
      color: #242e5a;
      margin-bottom: 15px;
    }
    p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    .btn {
      display: inline-block;
      background-color: #242e5a;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: #C1B086;
    }
  </style>
</head>
<body>

  <div class="card">
    <i class="fas fa-check-circle icon"></i>
    <h1>Réservation Reçue !</h1>
    <p>Merci d'avoir choisi le <strong>Riad Agadir</strong>. Votre demande de réservation a été transmise avec succès à notre équipe. Nous vous contacterons très rapidement.</p>
    <a href="index.html" class="btn"><i class="fas fa-home"></i> Retour à l'accueil</a>
  </div>

</body>
</html>
